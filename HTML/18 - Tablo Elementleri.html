HTML'de Tablo Elementleri
Web sayfalarında verileri düzenli bir şekilde göstermek için tablo (table) yapıları kullanılır.

HTML'de bir tablo oluşturmak için <table> etiketi kullanılır.
Tablo satırlarını (<tr>), sütunları (<td>) ve başlıkları (<th>) içerir.
Örnek Kullanım:


<table border="1">
  <tr>
    <th>Ad</th>
    <th>Soyad</th>
    <th>Yaş</th>
  </tr>
  <tr>
    <td>Ali</td>
    <td>Yılmaz</td>
    <td>25</td>
  </tr>
  <tr>
    <td>Ayşe</td>
    <td>Demir</td>
    <td>30</td>
  </tr>
</table>
