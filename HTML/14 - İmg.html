 <img> Etiketi (Görsel)
Ne İşe Yarar?
Bir web sayfasına resim eklemek için kullanılır.
Kullanım Şekli:

<img src="img.jpg" alt="Örnek Resim">
<img src="yasinozdemir.com/img" alt="Örnek Resim">
src (Source): Görselin URL'si veya dosya yolu.
alt: Görsel yüklenmezse gösterilecek alternatif metin.

Özellik Eklemek:
Görsel Genişliği ve Yüksekliği Ayarlama:

<img src="img.jpg" alt="Örnek Resim" width="300" height="200">
Link İçine Görsel Koyma:

<a href="https://www.google.com">
  <img src="img.jpg" alt="Google">
</a>
