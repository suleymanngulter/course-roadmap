<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Formlar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h2 class="text-primary text-center">Bootstrap Formlar</h2>

        <!-- 1. Temel Form -->
        <form>
            <div class="mb-3">
                <label for="ad" class="form-label">Adınız</label>
                <input type="text" class="form-control" id="ad" placeholder="Adınızı girin">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-posta</label>
                <input type="email" class="form-control" id="email" placeholder="E-posta adresinizi girin">
            </div>

            <div class="mb-3">
                <label for="sifre" class="form-label">Şifre</label>
                <input type="password" class="form-control" id="sifre" placeholder="Şifrenizi girin">
            </div>

            <!-- 2. Checkbox ve Radio Butonlar -->
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="beniHatirla">
                <label class="form-check-label" for="beniHatirla">Beni Hatırla</label>
            </div>

            <div class="mb-3">
                <label class="form-label">Cinsiyet</label>
                <div>
                    <input type="radio" class="form-check-input" name="cinsiyet" id="erkek">
                    <label class="form-check-label" for="erkek">Erkek</label>
                </div>
                <div>
                    <input type="radio" class="form-check-input" name="cinsiyet" id="kadin">
                    <label class="form-check-label" for="kadin">Kadın</label>
                </div>
            </div>

            <!-- 3. Seçim Kutusu (Select) -->
            <div class="mb-3">
                <label for="sehir" class="form-label">Şehir Seçin</label>
                <select class="form-select" id="sehir">
                    <option selected>Bir şehir seçin...</option>
                    <option value="1">İstanbul</option>
                    <option value="2">Ankara</option>
                    <option value="3">İzmir</option>
                </select>
            </div>

            <!-- 4. Textarea -->
            <div class="mb-3">
                <label for="yorum" class="form-label">Yorumunuz</label>
                <textarea class="form-control" id="yorum" rows="3" placeholder="Yorumunuzu yazın"></textarea>
            </div>

            <!-- 5. Buton -->
            <button type="submit" class="btn btn-primary">Gönder</button>
        </form>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
