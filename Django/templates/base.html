<!-- Ortak iskelet. Diğer sayfalar sadece block icerik doldurur. -->
<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Django ders{% endblock %}</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem 2rem;
        line-height: 1.5;
      }
      nav a { margin-right: 1rem; }
      .kutu {
        border: 1px solid #ccc;
        padding: 1rem;
        margin: 1rem 0;
      }
      footer { color: #555; font-size: 0.9rem; }
      code { background: #f3f3f3; padding: 0 0.25rem; }
    </style>
  </head>
  <body>
    <nav>
      <a href="{% url 'anasayfa:index' %}">Anasayfa</a>
      <a href="{% url 'anasayfa:hakkimizda' %}">Hakkımızda</a>
      <a href="{% url 'urunler:liste' %}">Ürünler</a>
      <a href="{% url 'iletisim:form' %}">İletişim</a>
      <a href="/admin/">Admin</a>
    </nav>
    <hr />
    {% block icerik %}{% endblock %}
    <hr />
    <footer>Temel Django dersi — 3 modül: anasayfa, ürünler, iletişim.</footer>
  </body>
</html>
